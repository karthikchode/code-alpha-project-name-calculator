<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0f172a;
      font-family:Verdana, sans-serif;
    }

    .calculator{
      width:350px;
      background:#1e293b;
      padding:20px;
      border-radius:20px;
      box-shadow:0 8px 25px rgba(0,0,0,0.5);
    }

    .screen{
      width:100%;
      height:80px;
      background:#0f172a;
      border:none;
      border-radius:12px;
      color:#fff;
      font-size:2rem;
      text-align:right;
      padding:15px;
      margin-bottom:20px;
      outline:none;
    }

    .btns{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
    }

    button{
      height:65px;
      border:none;
      border-radius:15px;
      font-size:1.2rem;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:translateY(-3px);
    }

    .num{
      background:#334155;
      color:white;
    }

    .operator{
      background:#f97316;
      color:white;
    }

    .equal{
      background:#22c55e;
      color:white;
      grid-column:span 2;
    }

    .clear{
      background:#ef4444;
      color:white;
    }

    .special{
      background:#6366f1;
      color:white;
    }

    @media(max-width:400px){
      .calculator{
        width:90%;
      }
    }
  </style>
</head>

<body>

  <div class="calculator">

    <input type="text" class="screen" id="screen" readonly>

    <div class="btns">

      <button class="clear" onclick="clearScreen()">AC</button>
      <button class="special" onclick="removeOne()">DEL</button>
      <button class="operator" onclick="press('%')">%</button>
      <button class="operator" onclick="press('/')">÷</button>

      <button class="num" onclick="press('7')">7</button>
      <button class="num" onclick="press('8')">8</button>
      <button class="num" onclick="press('9')">9</button>
      <button class="operator" onclick="press('*')">×</button>

      <button class="num" onclick="press('4')">4</button>
      <button class="num" onclick="press('5')">5</button>
      <button class="num" onclick="press('6')">6</button>
      <button class="operator" onclick="press('-')">−</button>

      <button class="num" onclick="press('1')">1</button>
      <button class="num" onclick="press('2')">2</button>
      <button class="num" onclick="press('3')">3</button>
      <button class="operator" onclick="press('+')">+</button>

      <button class="num" onclick="press('0')">0</button>
      <button class="num" onclick="press('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>

    </div>
  </div>

  <script>

    let screen = document.getElementById("screen");

    function press(value){
      screen.value += value;
    }

    function clearScreen(){
      screen.value = "";
    }

    function removeOne(){
      screen.value = screen.value.substring(0, screen.value.length - 1);
    }

    function calculate(){

      try{
        screen.value = Function("return " + screen.value)();
      }

      catch{
        screen.value = "Invalid";
      }
    }

    // Keyboard Support
    document.addEventListener("keydown", function(event){

      let key = event.key;

      if(!isNaN(key) || ['+', '-', '*', '/', '.', '%'].includes(key)){
        press(key);
      }

      else if(key === "Enter"){
        calculate();
      }

      else if(key === "Backspace"){
        removeOne();
      }

      else if(key === "Escape"){
        clearScreen();
      }

    });

  </script>

</body>
</html>
